<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0a1a40">
  <title>Entrega de Bolsas — Futsal</title>
  <link rel="icon" href="/logo.png">
  <style>
    :root { --navy:#112b66; --dark:#0a1a40; --gold:#dfa818; --cream:#fbf8f3; --soft:#d9deea; --muted:#9aa6c0; --ok:#2dc653; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, -apple-system, Arial, sans-serif; background: var(--dark); color: var(--cream); min-height: 100vh; }
    header { position: sticky; top: 0; z-index: 5; background: var(--navy); border-bottom: 3px solid var(--gold); padding: 10px 14px 12px; }
    .top { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .top img { width: 34px; }
    .top h1 { font-size: 1.05rem; color: var(--gold); flex: 1; }
    .count { font-size: .95rem; color: var(--soft); white-space: nowrap; }
    .count b { color: var(--ok); font-size: 1.15rem; }
    .bar { height: 6px; background: rgba(255,255,255,.15); border-radius: 3px; overflow: hidden; margin-bottom: 10px; }
    .bar div { height: 100%; background: var(--ok); width: 0; transition: width .3s; }
    input.busca { width: 100%; padding: 13px 14px; font-size: 1.05rem; border-radius: 10px; border: none; background: var(--cream); color: #111; }
    .chips { display: flex; gap: 8px; margin-top: 10px; }
    .chip { flex: 1; padding: 9px 6px; border-radius: 20px; border: 1px solid var(--muted); background: transparent; color: var(--soft); font-weight: 700; font-size: .9rem; }
    .chip.on { background: var(--gold); color: var(--dark); border-color: var(--gold); }
    main { padding: 12px 12px 40px; max-width: 720px; margin: 0 auto; }
    .card { background: var(--navy); border-radius: 14px; padding: 14px; margin-bottom: 10px; border-left: 6px solid var(--muted); }
    .card.ok { border-left-color: var(--ok); opacity: .85; }
    .nome { font-size: 1.2rem; font-weight: 800; display: flex; gap: 10px; align-items: baseline; }
    .num { color: var(--gold); font-size: 1rem; min-width: 34px; }
    .linha { color: var(--soft); font-size: .95rem; margin-top: 6px; }
    .retira { width: 100%; margin-top: 10px; padding: 11px; border-radius: 9px; border: 1px solid rgba(255,255,255,.2); background: var(--dark); color: var(--cream); font-size: 1rem; }
    .btn { display: block; width: 100%; margin-top: 10px; padding: 16px; border: none; border-radius: 12px; font-size: 1.1rem; font-weight: 800; cursor: pointer; }
    .btn.entregar { background: var(--ok); color: #06301a; }
    .btn.desfazer { background: transparent; border: 1px solid var(--muted); color: var(--soft); font-size: .95rem; padding: 11px; }
    .btn:disabled { opacity: .6; }
    .msg { text-align: center; color: var(--soft); padding: 30px 10px; }
    .login { max-width: 380px; margin: 60px auto; padding: 0 16px; text-align: center; }
    .login img { width: 110px; margin-bottom: 14px; }
    .login input { width: 100%; padding: 14px; font-size: 1.1rem; border-radius: 10px; border: none; margin: 14px 0 10px; }
    .login button { width: 100%; padding: 14px; font-size: 1.1rem; font-weight: 800; border: none; border-radius: 10px; background: var(--gold); color: var(--dark); }
    .erro { color: #ff6b6b; margin-top: 8px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="login" id="login">
    <img src="/logo.png" alt="">
    <h2 style="color:var(--gold)">Entrega de Bolsas</h2>
    <p style="color:var(--soft);margin-top:6px">Associação Futsal Resenha &amp; Samba</p>
    <input type="password" id="chave" placeholder="Senha" autocomplete="current-password">
    <button id="btnEntrar">ENTRAR</button>
    <p class="erro" id="erroLogin"></p>
  </div>

  <div id="app" class="hidden">
    <header>
      <div class="top">
        <img src="/logo.png" alt="">
        <h1>Entrega de Bolsas</h1>
        <div class="count"><b id="nOk">0</b> / <span id="nTotal">0</span> entregues</div>
      </div>
      <div class="bar"><div id="barra"></div></div>
      <input class="busca" id="busca" type="search" placeholder="🔎 Buscar nome ou número" autocomplete="off">
      <div class="chips">
        <button class="chip on" data-f="faltam">Faltam</button>
        <button class="chip" data-f="ok">Entregues</button>
        <button class="chip" data-f="todos">Todos</button>
      </div>
    </header>
    <main id="lista"><p class="msg">Carregando…</p></main>
  </div>

<script>
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const norm = (s) => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  const fmt = (iso) => iso ? new Date(iso).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : '';
  let chave = '', itens = [], filtro = 'faltam';
  try { chave = sessionStorage.getItem('chaveBolsas') || ''; } catch (_) {}

  async function carregar() {
    const r = await fetch(`/api/bolsas?chave=${encodeURIComponent(chave)}`);
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.erro || 'Erro ao carregar.');
    itens = d.bolsas; render();
  }

  function render() {
    const total = itens.length, ok = itens.filter(i => i.entregue).length;
    $('nOk').textContent = ok; $('nTotal').textContent = total;
    $('barra').style.width = total ? (ok / total * 100) + '%' : '0';
    const q = norm($('busca').value.trim());
    const lista = itens.filter(i => {
      if (filtro === 'faltam' && i.entregue) return false;
      if (filtro === 'ok' && !i.entregue) return false;
      return !q || norm(i.nome).includes(q) || String(i.n) === q;
    });
    if (!lista.length) { $('lista').innerHTML = `<p class="msg">${q ? 'Ninguém encontrado.' : (filtro === 'faltam' ? 'Todas as bolsas foram entregues 🎉' : 'Nenhuma bolsa aqui.')}</p>`; return; }
    $('lista').innerHTML = lista.map(i => `
      <div class="card ${i.entregue ? 'ok' : ''}">
        <div class="nome"><span class="num">${i.n}</span>${esc(i.nome)}</div>
        ${i.entregue
          ? `<div class="linha" style="color:var(--ok);font-weight:700">✅ Entregue em ${fmt(i.entregueEm)}${i.retiradoPor ? ' · retirado por ' + esc(i.retiradoPor) : ''}</div>
             <button class="btn desfazer" data-id="${i.id}" data-v="0">Desfazer entrega</button>`
          : `<input class="retira" id="r_${i.id}" placeholder="Retirado por outra pessoa? (opcional)">
             <button class="btn entregar" data-id="${i.id}" data-v="1">✅ ENTREGAR BOLSA</button>`}
        ${i.obs ? `<div class="linha">📝 ${esc(i.obs)}</div>` : ''}
      </div>`).join('');
  }

  $('lista').addEventListener('click', async (e) => {
    const b = e.target.closest('button[data-id]');
    if (!b) return;
    const entregue = b.dataset.v === '1';
    if (!entregue && !b.dataset.confirm) {
      b.dataset.confirm = '1'; b.textContent = 'Toque de novo para confirmar';
      setTimeout(() => { if (b.isConnected) { delete b.dataset.confirm; b.textContent = 'Desfazer entrega'; } }, 3000);
      return;
    }
    const retiradoPor = entregue ? ($('r_' + b.dataset.id)?.value || '') : '';
    b.disabled = true; b.textContent = 'Salvando…';
    try {
      const r = await fetch('/api/bolsas', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ chave, id: b.dataset.id, entregue, retiradoPor }) });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.erro || 'Falha');
      const i = itens.findIndex(x => x.id === d.id); if (i >= 0) itens[i] = d;
      render();
    } catch (err) { b.disabled = false; b.textContent = 'Erro, toque para tentar de novo'; }
  });

  document.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => {
    document.querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x === c));
    filtro = c.dataset.f; render();
  }));
  $('busca').addEventListener('input', render);

  async function entrar() {
    chave = $('chave').value.trim() || chave;
    $('erroLogin').textContent = '';
    try {
      await carregar();
      try { sessionStorage.setItem('chaveBolsas', chave); } catch (_) {}
      $('login').classList.add('hidden'); $('app').classList.remove('hidden');
      setInterval(() => { if (!document.querySelector('.retira:focus')) carregar().catch(() => {}); }, 30000);
    } catch (err) { $('erroLogin').textContent = err.message; }
  }
  $('btnEntrar').addEventListener('click', entrar);
  $('chave').addEventListener('keydown', e => { if (e.key === 'Enter') entrar(); });
  if (chave) entrar();
</script>
</body>
</html>
