<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0a1a40">
  <title>Portaria — Festa do Futsal</title>
  <link rel="icon" href="/logo.png">
  <style>
    :root { --navy:#112b66; --dark:#0a1a40; --gold:#dfa818; --cream:#fbf8f3; --soft:#d9deea; --muted:#9aa6c0; --ok:#2dc653; --err:#ff6b6b; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, -apple-system, Arial, sans-serif; background: var(--dark); color: var(--cream); min-height: 100vh; }
    header { position: sticky; top: 0; z-index: 5; background: var(--navy); border-bottom: 3px solid var(--gold); padding: 10px 14px 12px; }
    .top { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .top img { width: 34px; }
    .top h1 { font-size: 1.05rem; color: var(--gold); flex: 1; }
    .count { font-size: .95rem; color: var(--soft); white-space: nowrap; }
    .count b { color: var(--ok); font-size: 1.15rem; }
    .bar { height: 6px; background: rgba(255,255,255,.15); border-radius: 3px; overflow: hidden; margin-bottom: 10px; }
    .bar div { height: 100%; background: var(--ok); width: 0; transition: width .3s; }
    input.busca { width: 100%; padding: 13px 14px; font-size: 1.05rem; border-radius: 10px; border: none; background: var(--cream); color: #111; }
    .chips { display: flex; gap: 8px; margin-top: 10px; }
    .chip { flex: 1; padding: 9px 6px; border-radius: 20px; border: 1px solid var(--muted); background: transparent; color: var(--soft); font-weight: 700; font-size: .9rem; }
    .chip.on { background: var(--gold); color: var(--dark); border-color: var(--gold); }
    main { padding: 12px 12px 40px; max-width: 720px; margin: 0 auto; }
    .card { background: var(--navy); border-radius: 14px; padding: 14px; margin-bottom: 10px; border-left: 6px solid var(--muted); }
    .card.dentro { border-left-color: var(--ok); opacity: .82; }
    .nome { font-size: 1.15rem; font-weight: 800; line-height: 1.25; }
    .linha { color: var(--soft); font-size: .95rem; margin-top: 4px; }
    .linha b { color: var(--cream); }
    .tag { display: inline-block; font-size: .75rem; padding: 2px 8px; border-radius: 10px; margin-left: 4px; vertical-align: middle; background: rgba(255,255,255,.15); }
    .tag.bad { background: var(--err); color: #fff; font-weight: 800; }
    .tag.kid { background: var(--gold); color: var(--dark); }
    .btn { display: block; width: 100%; margin-top: 12px; padding: 16px; border: none; border-radius: 12px; font-size: 1.1rem; font-weight: 800; cursor: pointer; }
    .btn.entrar { background: var(--ok); color: #06301a; }
    .btn.desfazer { background: transparent; border: 1px solid var(--muted); color: var(--soft); font-size: .95rem; padding: 11px; }
    .btn:disabled { opacity: .6; }
    .msg { text-align: center; color: var(--soft); padding: 30px 10px; }
    .login { max-width: 380px; margin: 60px auto; padding: 0 16px; text-align: center; }
    .login img { width: 110px; margin-bottom: 14px; }
    .login input { width: 100%; padding: 14px; font-size: 1.1rem; border-radius: 10px; border: none; margin: 14px 0 10px; }
    .login button { width: 100%; padding: 14px; font-size: 1.1rem; font-weight: 800; border: none; border-radius: 10px; background: var(--gold); color: var(--dark); }
    .erro { color: var(--err); margin-top: 8px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="login" id="login">
    <img src="/logo.png" alt="">
    <h2 style="color:var(--gold)">Portaria</h2>
    <p style="color:var(--soft);margin-top:6px">Lista de pagantes da Festa do Futsal</p>
    <input type="password" id="chave" placeholder="Senha da portaria" autocomplete="current-password">
    <button id="btnEntrar">ENTRAR</button>
    <p class="erro" id="erroLogin"></p>
  </div>

  <div id="app" class="hidden">
    <header>
      <div class="top">
        <img src="/logo.png" alt="">
        <h1>Portaria</h1>
        <div class="count"><b id="nDentro">0</b> / <span id="nTotal">0</span> entraram</div>
      </div>
      <div class="bar"><div id="barra"></div></div>
      <input class="busca" id="busca" type="search" placeholder="🔎 Buscar nome, RG, nº do sócio ou pedido" autocomplete="off">
      <div class="chips">
        <button class="chip on" data-f="faltam">Faltam</button>
        <button class="chip" data-f="dentro">Entraram</button>
        <button class="chip" data-f="todos">Todos</button>
      </div>
    </header>
    <main id="lista"><p class="msg">Carregando…</p></main>
  </div>

<script>
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const norm = (s) => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  let chave = '';
  let pessoas = [];
  let filtro = 'faltam';
  try { chave = sessionStorage.getItem('chavePortaria') || ''; } catch (_) {}

  async function carregar(silencioso) {
    const r = await fetch(`/api/lista?chave=${encodeURIComponent(chave)}&status=pago`);
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.erro || 'Erro ao carregar.');
    pessoas = data.pedidos.flatMap(p => p.pessoas.map(x => ({
      ...x, codigo: p.codigo, socioNumero: p.socioNumero, socioNome: p.socioNome, socioValidado: p.socioValidado, tipo: p.tipo
    }))).sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR'));
    render();
  }

  function render() {
    const total = pessoas.length, dentro = pessoas.filter(p => p.entrou).length;
    $('nDentro').textContent = dentro; $('nTotal').textContent = total;
    $('barra').style.width = total ? (dentro / total * 100) + '%' : '0';
    const q = norm($('busca').value.trim());
    const qd = q.replace(/[^0-9a-z]/g, '');
    const lista = pessoas.filter(p => {
      if (filtro === 'faltam' && p.entrou) return false;
      if (filtro === 'dentro' && !p.entrou) return false;
      if (!q) return true;
      return norm(p.nome).includes(q) || (qd && norm(p.rg).replace(/[^0-9a-z]/g, '').includes(qd))
        || norm(p.socioNumero) === q || norm(p.codigo).replace('-', '').includes(qd);
    });
    if (!lista.length) { $('lista').innerHTML = `<p class="msg">${q ? 'Ninguém encontrado com essa busca.' : (filtro === 'faltam' ? 'Todos já entraram 🎉' : 'Nenhuma pessoa nesta lista.')}</p>`; return; }
    $('lista').innerHTML = lista.slice(0, 200).map(p => {
      const kid = p.faixa.startsWith('Criança') ? `<span class="tag kid">${esc(p.faixa)}</span>` : '';
      const bad = p.socioValidado === 'Inválido' ? '<span class="tag bad">SÓCIO INVÁLIDO</span>' : '';
      const hora = p.entradaEm ? new Date(p.entradaEm).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) : '';
      return `<div class="card ${p.entrou ? 'dentro' : ''}">
        <div class="nome">${esc(p.nome)} ${kid}</div>
        <div class="linha">RG: <b>${esc(p.rg) || '—'}</b></div>
        <div class="linha">Sócio: <b>${esc(p.socioNumero)}</b> · ${esc(p.socioNome)} ${bad}</div>
        <div class="linha">Pedido ${esc(p.codigo)}${p.titular ? ' · comprador' : ''}</div>
        ${p.entrou
          ? `<div class="linha" style="color:var(--ok);font-weight:700;margin-top:8px">✅ Entrou${hora ? ' às ' + hora : ''}</div>
             <button class="btn desfazer" data-id="${p.id}" data-v="0">Desfazer entrada</button>`
          : `<button class="btn entrar" data-id="${p.id}" data-v="1">✅ MARCAR ENTRADA</button>`}
      </div>`;
    }).join('') + (lista.length > 200 ? '<p class="msg">Use a busca para ver mais pessoas.</p>' : '');
  }

  $('lista').addEventListener('click', async (e) => {
    const b = e.target.closest('button[data-id]');
    if (!b) return;
    const entrou = b.dataset.v === '1';
    if (!entrou && !confirmarDesfazer(b)) return;
    b.disabled = true; b.textContent = 'Salvando…';
    try {
      const r = await fetch('/api/entrada', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ chave, id: b.dataset.id, entrou }) });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(data.erro || 'Falha ao salvar');
      const p = pessoas.find(x => x.id === data.id);
      if (p) { p.entrou = data.entrou; p.entradaEm = data.entradaEm; }
      render();
    } catch (err) {
      b.disabled = false; b.textContent = 'Erro, toque para tentar de novo';
    }
  });
  // desfazer pede um segundo toque (evita toque acidental)
  function confirmarDesfazer(b) {
    if (b.dataset.confirm) return true;
    b.dataset.confirm = '1'; b.textContent = 'Toque de novo para confirmar';
    setTimeout(() => { if (b.isConnected) { delete b.dataset.confirm; b.textContent = 'Desfazer entrada'; } }, 3000);
    return false;
  }

  document.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => {
    document.querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x === c));
    filtro = c.dataset.f; render();
  }));
  $('busca').addEventListener('input', render);

  async function entrar() {
    chave = $('chave').value.trim() || chave;
    $('erroLogin').textContent = '';
    try {
      await carregar();
      try { sessionStorage.setItem('chavePortaria', chave); } catch (_) {}
      $('login').classList.add('hidden'); $('app').classList.remove('hidden');
      setInterval(() => carregar(true).catch(() => {}), 30000); // atualiza a cada 30 s (várias pessoas na portaria)
    } catch (err) { $('erroLogin').textContent = err.message; }
  }
  $('btnEntrar').addEventListener('click', entrar);
  $('chave').addEventListener('keydown', e => { if (e.key === 'Enter') entrar(); });
  if (chave) entrar();
</script>
</body>
</html>
