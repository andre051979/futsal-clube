<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Lista da Portaria — Festa do Futsal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Arial, sans-serif; color: #111; background: #f3f4f7; padding: 16px; font-size: 14px; }
    .wrap { max-width: 980px; margin: 0 auto; background: #fff; padding: 24px; border-radius: 10px; }
    header { display: flex; align-items: center; gap: 14px; border-bottom: 3px solid #dfa818; padding-bottom: 12px; margin-bottom: 16px; }
    header img { width: 54px; }
    header h1 { font-size: 1.35rem; color: #112b66; }
    header p { color: #555; font-size: .9rem; }
    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; align-items: center; }
    .toolbar input, .toolbar select { padding: 9px; border: 1px solid #bbb; border-radius: 6px; font-size: .95rem; }
    .toolbar button { padding: 9px 16px; border: none; border-radius: 6px; background: #112b66; color: #fff; font-weight: 700; cursor: pointer; }
    .toolbar button.gold { background: #dfa818; color: #111; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; margin-bottom: 18px; }
    .stat { border: 1px solid #ddd; border-radius: 8px; padding: 10px; text-align: center; }
    .stat b { display: block; font-size: 1.4rem; color: #112b66; }
    h2 { font-size: 1.05rem; color: #112b66; margin: 22px 0 8px; }
    table { width: 100%; border-collapse: collapse; margin-bottom: 6px; }
    th, td { border: 1px solid #cfd3dc; padding: 6px 8px; text-align: left; vertical-align: top; }
    th { background: #eef1f7; font-size: .85rem; }
    td.box { width: 58px; text-align: center; }
    td.box span { display: inline-block; width: 18px; height: 18px; border: 2px solid #333; border-radius: 3px; }
    .grupo { page-break-inside: avoid; margin-bottom: 14px; }
    .grupo-head { background: #112b66; color: #fff; padding: 7px 10px; border-radius: 6px 6px 0 0; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px; font-weight: 600; }
    .tag { font-size: .78rem; padding: 1px 8px; border-radius: 10px; background: #dfa818; color: #111; }
    .tag.bad { background: #ff6b6b; color: #fff; }
    .tag.ok { background: #2dc653; color: #fff; }
    .titular { font-weight: 700; }
    .msg { padding: 14px; background: #fff4d6; border-radius: 8px; }
    @media print {
      body { background: #fff; padding: 0; font-size: 11.5px; }
      .wrap { padding: 0; border-radius: 0; }
      .toolbar, .no-print { display: none !important; }
      .grupo-head { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      th { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      h2.quebra { page-break-before: always; }
    }
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="/logo.png" alt="">
    <div>
      <h1>Grande Festa do Futsal: Lista da Portaria</h1>
      <p>23 de outubro · Salão Nobre do Clube · <span id="gerado"></span></p>
    </div>
  </header>

  <div class="toolbar">
    <input type="password" id="chave" placeholder="Chave de acesso">
    <select id="status">
      <option value="pago">Somente pagos (portaria)</option>
      <option value="todos">Todos os pedidos (conferência)</option>
    </select>
    <select id="ordem">
      <option value="socio">Agrupar por sócio</option>
      <option value="alfa">Ordem alfabética (todas as pessoas)</option>
    </select>
    <button id="btnCarregar">Carregar</button>
    <button class="gold" onclick="window.print()">🖨️ Imprimir</button>
  </div>

  <div id="out"><p class="msg">Digite a chave de acesso e clique em <b>Carregar</b>.</p></div>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const brl = (n) => Number(n || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
  try { $('chave').value = sessionStorage.getItem('chavePortaria') || ''; } catch (_) {}

  async function carregar() {
    const chave = $('chave').value.trim();
    if (!chave) return;
    try { sessionStorage.setItem('chavePortaria', chave); } catch (_) {}
    $('out').innerHTML = '<p class="msg">Carregando…</p>';
    const status = $('status').value === 'todos' ? 'todos' : 'pago';
    const r = await fetch(`/api/lista?chave=${encodeURIComponent(chave)}&status=${status}`);
    const data = await r.json().catch(() => ({}));
    if (!r.ok) { $('out').innerHTML = `<p class="msg">${esc(data.erro || 'Erro ao carregar.')}</p>`; return; }
    $('gerado').textContent = 'Gerado em ' + new Date(data.geradoEm).toLocaleString('pt-BR');
    render(data.pedidos);
  }

  function tagSocio(v) {
    if (v === 'Válido') return '<span class="tag ok">sócio válido</span>';
    if (v === 'Inválido') return '<span class="tag bad">SÓCIO INVÁLIDO</span>';
    return '<span class="tag">sócio não verificado</span>';
  }

  function render(pedidos) {
    const pessoas = pedidos.flatMap(p => p.pessoas.map(x => ({ ...x, pedido: p })));
    const cont = (f) => pessoas.filter(x => x.faixa.startsWith(f)).length;
    let h = `<div class="stats">
      <div class="stat"><b>${pedidos.length}</b>pedidos</div>
      <div class="stat"><b>${pessoas.length}</b>pessoas</div>
      <div class="stat"><b>${cont('Adulto')}</b>adultos</div>
      <div class="stat"><b>${cont('Criança 6')}</b>crianças 6-11</div>
      <div class="stat"><b>${cont('Criança 0')}</b>crianças 0-5</div>
      <div class="stat"><b>${brl(pedidos.reduce((s, p) => s + p.total, 0))}</b>valor</div>
    </div>`;
    if (!pedidos.length) { $('out').innerHTML = h + '<p class="msg">Nenhum pedido encontrado.</p>'; return; }

    if ($('ordem').value === 'alfa') {
      pessoas.sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR'));
      h += `<table><thead><tr><th>#</th><th>Nome completo</th><th>RG</th><th>Faixa</th><th>Pedido</th><th>Sócio resp.</th><th>Entrou</th></tr></thead><tbody>`;
      pessoas.forEach((x, i) => h += `<tr><td>${i + 1}</td><td class="${x.titular ? 'titular' : ''}">${esc(x.nome)}</td><td>${esc(x.rg) || '—'}</td><td>${esc(x.faixa)}</td><td>${esc(x.pedido.codigo)}${x.pedido.status !== 'Pago' ? ' (' + esc(x.pedido.status) + ')' : ''}</td><td>${esc(x.pedido.socioNumero)}</td><td class="box"><span></span></td></tr>`);
      h += `</tbody></table>`;
    } else {
      // agrupa por nº de sócio
      const grupos = {};
      pedidos.forEach(p => (grupos[p.socioNumero] ||= []).push(p));
      const chaves = Object.keys(grupos).sort((a, b) => a.localeCompare(b, 'pt-BR', { numeric: true }));
      chaves.forEach(k => {
        grupos[k].forEach(p => {
          h += `<div class="grupo">
            <div class="grupo-head"><span>Sócio nº ${esc(k)} · ${esc(p.socioNome)} ${tagSocio(p.socioValidado)}</span>
            <span>${esc(p.codigo)} · ${esc(p.tipo)} · ${esc(p.status)} · ${brl(p.total)}</span></div>
            <table><thead><tr><th>Nome completo</th><th>RG</th><th>Faixa</th><th>Entrou</th></tr></thead><tbody>`;
          p.pessoas.forEach(x => h += `<tr><td class="${x.titular ? 'titular' : ''}">${esc(x.nome)}${x.titular ? ' (comprador)' : ''}</td><td>${esc(x.rg) || '—'}</td><td>${esc(x.faixa)}</td><td class="box"><span></span></td></tr>`);
          h += `</tbody></table></div>`;
        });
      });
    }

    // Lista resumida para o clube validar os sócios
    const socios = {};
    pedidos.forEach(p => {
      const s = (socios[p.socioNumero] ||= { nome: p.socioNome, pedidos: 0, pessoas: 0, valid: p.socioValidado });
      s.pedidos++; s.pessoas += p.pessoas.length;
    });
    h += `<h2 class="quebra">Conferência de sócios (enviar ao clube)</h2>
      <table><thead><tr><th>Nº do sócio</th><th>Nome informado</th><th>Pedidos</th><th>Pessoas</th><th>Situação</th></tr></thead><tbody>`;
    Object.keys(socios).sort((a, b) => a.localeCompare(b, 'pt-BR', { numeric: true })).forEach(k => {
      const s = socios[k];
      h += `<tr><td>${esc(k)}</td><td>${esc(s.nome)}</td><td>${s.pedidos}</td><td>${s.pessoas}</td><td>${esc(s.valid)}</td></tr>`;
    });
    h += `</tbody></table>`;
    $('out').innerHTML = h;
  }

  $('btnCarregar').addEventListener('click', carregar);
  $('chave').addEventListener('keydown', e => { if (e.key === 'Enter') carregar(); });
  $('status').addEventListener('change', () => $('chave').value && carregar());
  $('ordem').addEventListener('change', () => $('chave').value && carregar());
</script>
</body>
</html>
